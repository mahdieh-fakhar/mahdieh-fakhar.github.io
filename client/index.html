    <!-- GitHub Pages SPA Redirect Handler -->
    <!-- Base href ensures manifest hydration on GitHub Pages root deployment -->
    <base href="/">
  <!-- Prefer always revalidating index.html to avoid stale HTML referencing old asset filenames -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Content Security Policy: allow Credly embed and common external sources -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.credly.com https://www.credly.com https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://images.credly.com data:; frame-src https://www.credly.com; font-src https://fonts.gstatic.com data:; connect-src 'self' https:;">
    <script>
      (function (l) {
        if (l.search.length > 1 && l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          var baseHref = document.querySelector("base")?.getAttribute("href") || "/";
          var basePath = baseHref.endsWith("/") ? baseHref.slice(0, -1) : baseHref;
          var newUrl = basePath + (decoded.startsWith("/") ? decoded : "/" + decoded);
          window.history.replaceState(null, null, newUrl + l.hash);
        }
      })(window.location);
    </script>


    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/logo.png" />
    <link rel="manifest" href="./site.webmanifest" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.credly.com" crossorigin>
    <link rel="preconnect" href="https://www.credly.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      const baseEl = document.querySelector("base");
      const baseHref = baseEl ? baseEl.getAttribute("href") || "/" : "/";
      const base = baseHref.endsWith("/") ? baseHref.slice(0, -1) : baseHref;
      const manifestUrl = base + "/manifest.json";
      const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);

      async function loadStyles(urls = []) {
        urls.forEach((url) => {
          if (!url) return;
          if (document.querySelector('link[rel="stylesheet"][href="' + url + '"]')) return;
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = url;
          link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        });
      }

      function showBootstrapError(message) {
        try {
          const overlay = document.createElement("div");
          overlay.style.position = "fixed";
          overlay.style.inset = "0";
          overlay.style.background = "rgba(0,0,0,0.7)";
          overlay.style.color = "white";
          overlay.style.display = "flex";
          overlay.style.alignItems = "center";
          overlay.style.justifyContent = "center";
          overlay.style.fontFamily = "system-ui, sans-serif";
          overlay.style.zIndex = "2147483647";
          overlay.textContent =
            message || "Application failed to load. Please refresh or try a private window.";
          document.body.appendChild(overlay);
        } catch (error) {
          console.error("Bootstrap overlay failed", error);
        }
      }

      async function loadFromManifest() {
        const response = await fetch(manifestUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Manifest not available");
        }
        const manifest = await response.json();
        const entry =
          manifest["src/main.tsx"] ||
          Object.values(manifest).find((item) => item && item.isEntry);
        if (!entry || !entry.file) {
          throw new Error("Entry file missing in manifest");
        }

        const entryCss = Array.isArray(entry.css)
          ? entry.css.map((file) => `${base}/${file.replace(/^\//, "")}`)
          : [];
        await loadStyles(entryCss);

        const entryUrl = `${base}/${entry.file.replace(/^\//, "")}`;
        return import(entryUrl);
      }

      function loadDev() {
        return import("/src/main.tsx");
      }

      (async () => {
        try {
          if (isLocal) {
            await loadDev();
          } else {
            await loadFromManifest();
          }
        } catch (error) {
          console.error("Bootstrap error", error);
          if (isLocal) {
            showBootstrapError("Dev bundle failed to load.");
          } else {
            try {
              await loadDev();
            } catch (devError) {
              console.error("Dev fallback failed", devError);
              showBootstrapError();
            }
          }
        }
      })();
    </script>

    <script async defer id="credly-embed-script" src="https://cdn.credly.com/assets/utilities/embed.js"></script>
  </body>
