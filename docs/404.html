<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var base = l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "");
        var repoPath = l.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/");
        var relativePath = l.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~");
        var search = l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "";
        var newUrl = base + repoPath + "/?/" + relativePath + search + l.hash;
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
