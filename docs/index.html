    <!-- App bootloader: try multiple candidate JS/CSS assets so older cached HTML
      that references different hashed filenames can still find a working bundle.
      This makes refresh/resiliency better for GitHub Pages deployments. -->
    <script>
      (function () {
        var base = '/mf1';
        var jsCandidates = [
          base + '/assets/index-D0opiNsC.js',
          base + '/assets/index-ClveqC3n.js',
          base + '/assets/index-CLZrhGIp.js'
        ];
        var cssCandidates = [
          base + '/assets/index-CbJJ0kmH.css',
          base + '/assets/index-CSTIc2Dc.css',
          base + '/assets/index-Dd8krhSz.css'
        ];

        function fetchOk(url) {
          return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
            return r.ok;
          }).catch(function () { return false; });
        }

        function loadCss(url) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = url;
          l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        }

        function loadModule(url) {
          var s = document.createElement('script');
          s.type = 'module';
          s.src = url;
          s.crossOrigin = 'anonymous';
          s.async = true;
          s.onload = function () { /* loaded */ };
          s.onerror = function () { /* handled below by trying next candidate */ };
          document.body.appendChild(s);
        }

        function showBootstrapError() {
          try {
            var overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.left = 0;
            overlay.style.top = 0;
            overlay.style.right = 0;
            overlay.style.bottom = 0;
            overlay.style.background = 'rgba(0,0,0,0.6)';
            overlay.style.color = 'white';
            overlay.style.zIndex = 999999;
            overlay.style.display = 'flex';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.fontFamily = 'sans-serif';
            overlay.innerText = 'Application failed to load. Please try a hard refresh (Ctrl+F5) or open in a private window.';
            document.body.appendChild(overlay);
          } catch (e) { /* ignore */ }
        }

        // Try CSS candidates (first one that exists)
        (function tryCss(i) {
          if (i >= cssCandidates.length) return;
          fetchOk(cssCandidates[i]).then(function (ok) {
            if (ok) loadCss(cssCandidates[i]);
            else tryCss(i + 1);
          });
        })(0);

        // Try JS candidates sequentially until one loads successfully by checking HEAD first
        (function tryJs(i) {
          if (i >= jsCandidates.length) {
            // nothing found - show error after short delay
            setTimeout(showBootstrapError, 500);
            return;
          }
          fetchOk(jsCandidates[i]).then(function (ok) {
            if (ok) {
              loadModule(jsCandidates[i]);
            } else {
              tryJs(i + 1);
            }
          }).catch(function () { tryJs(i + 1); });
        })(0);
      })();
    </script>
